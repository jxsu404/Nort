<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nort · Opción 5 — Pantalla bloqueada</title>
  <link rel="stylesheet" href="nort.css" />
  <style>
    .phone.lock {
      background: radial-gradient(420px 380px at 20% 15%, oklch(0.42 0.08 200 / 70%), transparent 70%),
        radial-gradient(420px 420px at 90% 70%, oklch(0.35 0.08 260 / 60%), transparent 70%),
        linear-gradient(170deg, oklch(0.22 0.04 230), oklch(0.12 0.02 250));
    }

    .lock .screen {
      gap: 12px;
      padding-top: 0;
    }

    .clock {
      text-align: center;
      padding: 18px 0 14px;
    }

    .clock .date {
      font-size: 17px;
      font-weight: 500;
      opacity: 0.85;
    }

    .clock .big {
      font-size: 92px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-top: 2px;
    }

    .glass {
      border-radius: 26px;
      padding: 16px;
      background: oklch(0.2 0.02 240 / 55%);
      border: 1px solid oklch(1 0 0 / 12%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .live-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .live-head .logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--primary-fg);
    }

    .eta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 12px;
    }

    .eta strong {
      font-size: 30px;
      letter-spacing: -0.02em;
      font-weight: 600;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .quick button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 4px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 500;
      background: oklch(1 0 0 / 8%);
      transition: background 0.2s, transform 0.1s;
    }

    .quick button:active {
      transform: scale(0.96);
    }

    .quick button.saved {
      background: rgb(52 211 153 / 20%);
      color: #6ee7b7;
    }

    .next {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid oklch(1 0 0 / 10%);
      font-size: 13px;
    }

    .notif {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .notif .logo {
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--primary-fg);
    }

    .lock-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 34px;
      display: flex;
      justify-content: space-between;
      padding: 0 46px;
    }

    .lock-bottom span {
      width: 50px;
      height: 50px;
      border-radius: 99px;
      display: grid;
      place-items: center;
      background: oklch(0.2 0.02 240 / 55%);
      backdrop-filter: blur(20px);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone lock">
      <div class="statusbar" data-time="kölbi"></div>

      <main class="screen">
        <div class="clock">
          <p class="date">martes, 6 de octubre</p>
          <p class="big">7:03</p>
        </div>

        <section class="glass">
          <div class="row-between">
            <span class="live-head"><span class="logo"><svg class="i" width="13" height="13"><use href="#i-nort"/></svg></span>Nort · en ruta</span>
            <span class="chip watch" style="height: 22px">+18 min</span>
          </div>
          <div class="eta">
            <strong>7:48</strong><span class="small muted">llegada a San José · 45 min</span>
          </div>
          <div class="bar" style="margin-top: 10px; background: oklch(1 0 0 / 12%)"><span style="width: 55%"></span><i style="left: 55%; border-color: oklch(0.25 0.03 230)"></i></div>

          <div class="quick">
            <button data-label="Trabajo"><svg class="i" width="22" height="22" style="color: var(--occupied)"><use href="#i-briefcase"/></svg>Trabajo</button>
            <button data-label="Personal"><svg class="i" width="22" height="22" style="color: var(--calm)"><use href="#i-home"/></svg>Personal</button>
            <button data-label="No olvidar"><svg class="i" width="22" height="22" style="color: var(--primary)"><use href="#i-bookmark"/></svg>No olvidar</button>
          </div>

          <div class="next">
            <svg class="i" width="16" height="16" style="color: var(--primary)"><use href="#i-sparkles"/></svg>
            <span>Al llegar, lo primero: <strong style="font-weight: 600">Reporte semanal</strong></span>
          </div>
        </section>

        <section class="glass notif" id="notif">
          <span class="logo"><svg class="i" width="18" height="18"><use href="#i-nort"/></svg></span>
          <div style="flex: 1; min-width: 0">
            <div class="row-between"><strong class="small">Nort</strong><span class="xs muted">hace 6 min</span></div>
            <p class="small" style="margin-top: 2px" id="notif-text">Guardado en “No se me olvide”. Lo completas al llegar.</p>
          </div>
        </section>

        <p class="xs" style="text-align: center; opacity: 0.6; margin-top: 4px">Sin desbloquear. Sin abrir la app.</p>
      </main>

      <div class="lock-bottom">
        <span><svg class="i" width="20" height="20"><use href="#i-flashlight"/></svg></span>
        <span><svg class="i" width="20" height="20"><use href="#i-camera"/></svg></span>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    document.querySelectorAll(".quick button").forEach((btn) => {
      btn.addEventListener("click", () => {
        btn.classList.add("saved");
        document.getElementById("notif-text").textContent = `Guardado en “${btn.dataset.label}”. Lo completas al llegar.`;
        document.querySelector("#notif .xs").textContent = "ahora";
        setTimeout(() => btn.classList.remove("saved"), 1400);
      });
    });
  </script>
</body>
</html>
